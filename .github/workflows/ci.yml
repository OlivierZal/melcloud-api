# Calls the family's reusable CI (library gates on).
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-ci.yml@b6fc63379fae3634daf4dd9495295b6d95f6b7fe # v4.4.0
    with:
      run-docs: true
      run-lint-package: true
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
