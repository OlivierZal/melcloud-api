# Calls the family's reusable CI (library gates on).
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-ci.yml@f9bba5c0c57b72f30b10fa38e35c48aa0e4024fb # v9.0.1
    with:
      run-docs: true
      run-lint-package: true
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
  # The push the Dependabot lane never raises: a merge it performs is
  # pushed with `GITHUB_TOKEN`, which starts no workflow.
  schedule:
    - cron: '23 4 * * *'
permissions: {}
