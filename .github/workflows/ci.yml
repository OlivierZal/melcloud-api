# Calls the family's reusable CI (library gates on).
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-ci.yml@9a7c5901faa9f17cf82b67553434c80a21a1df36 # v4.2.0
    with:
      run-docs: true
      run-lint-package: true
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
