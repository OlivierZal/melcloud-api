# Calls the family's reusable CI (library gates on).
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-ci.yml@5e246c3e387dbb6f0be8a861fcee4bbb1176cc00 # v7.0.1
    with:
      run-docs: true
      run-lint-package: true
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
