# Calls the family's reusable CI (library gates on).
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-ci.yml@571d0d1b4802e5620508c3253ef90181e005b066 # v8.12.0
    with:
      run-docs: true
      run-lint-package: true
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
  # The push the Dependabot lane never raises: a merge it performs is
  # pushed with `GITHUB_TOKEN`, which starts no workflow.
  schedule:
    - cron: '23 4 * * *'
permissions: {}
