# Calls the family's reusable CI (library gates on).
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-ci.yml@fec6cb6f6314305339ebf7fef322da2080e5cbba # v8.11.0
    with:
      run-docs: true
      run-lint-package: true
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
