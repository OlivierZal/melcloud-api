# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@f691686d44753b0dfb00a155c42ea66d89d78a1e # v6.1.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
