# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@9b69e8520dfd11484df292ca75c10d51beba75ca # v6.3.1
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
