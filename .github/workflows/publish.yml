# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@291dd9e28a6da8fe861d1ef9b4c21a5d4e813c3d # v7.1.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
