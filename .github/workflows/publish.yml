# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@9656fb8009b6b4c344dbdda62c99b95ed64bfe8f # v5.0.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
