# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@0d30d2ae20ce40a93347a684d50cdd717a5dbf7b # v7.2.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
