# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@a2ee75bd9cd4b8062b993e2ea488883c2863a2c5 # v6.2.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
