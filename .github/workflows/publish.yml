# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@76559db426286aab1f8e5ae8b0f98346cd9dfd2b # v6.0.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
