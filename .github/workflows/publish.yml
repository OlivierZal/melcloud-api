# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@d16eeb9fc509675429d325016c86038e555dc69e # v7.0.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
