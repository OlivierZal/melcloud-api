# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@0452a89407991c62512a64381eda175b96dbd272 # v8.3.1
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
