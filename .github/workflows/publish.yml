# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@5e246c3e387dbb6f0be8a861fcee4bbb1176cc00 # v7.0.1
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
