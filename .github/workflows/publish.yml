# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@acc28526c5c39ee5adc1dce7a81f1b8f4341645b # v8.4.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
