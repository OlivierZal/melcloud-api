# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@cabbcc9146dbf0e4bec2ed8b7a261aef62cfbafa # v6.4.1
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
