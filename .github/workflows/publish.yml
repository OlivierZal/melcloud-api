# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@2ea1b323f0428e1a86ca932e689e852c69278bb1 # v6.6.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
