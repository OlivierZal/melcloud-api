# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@83677ba411dc01903f5cfe02ae8f7b2eacc0a81f # v8.8.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
