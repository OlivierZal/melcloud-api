# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@2c0fa6ef42cb50088099135d35faf4eedd633b5a # v8.3.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
