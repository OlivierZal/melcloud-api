# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@1b0e5b4f303b76a102d1187448cda1e0d4d05b8b # v8.0.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
