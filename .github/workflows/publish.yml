# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@69361d84fae1d0d460da2308d41c140c0762a38b # v6.5.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
