# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@1c1c1108e004e63b1acebc89b34fc69551f9483a # v8.1.1
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
