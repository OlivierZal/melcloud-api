# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@375d0328ec02b2a1cd96ae580b9ecd86bd47ad12 # v8.1.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
