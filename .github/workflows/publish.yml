# Calls the family's reusable release pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages) in OlivierZal/configs.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@6570fe2d0d758a1734b6fe578788a50e402b8d31 # v8.2.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
