# Calls the family's reusable docs pipeline (typedoc build + GitHub
# Pages deploy) in OlivierZal/configs. `dry-run` builds without
# deploying: dispatch it once after each configs adoption and watch the
# build half succeed before a release reaches the deploy half.
jobs:
  docs:
    permissions:
      contents: read
      id-token: write
      packages: read
      pages: write
    uses: OlivierZal/configs/.github/workflows/reusable-docs.yml@a2ee75bd9cd4b8062b993e2ea488883c2863a2c5 # v6.2.0
    with:
      dry-run: ${{ inputs.dry-run || false }}
name: Generate & deploy docs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Build the site without deploying it.
        type: boolean
permissions: {}
